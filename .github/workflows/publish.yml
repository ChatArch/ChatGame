name: Publish Package

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_ver="$(python3 -c "
          import ast, pathlib
          src = pathlib.Path('src/chatgame/__init__.py').read_text()
          for node in ast.parse(src).body:
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == '__version__':
                          print(ast.literal_eval(node.value)); break
          ")"
          if [ "$tag" != "$pkg_ver" ]; then
            echo "Tag $GITHUB_REF_NAME != package version $pkg_ver"
            exit 1
          fi
          echo "PACKAGE_VERSION=$pkg_ver" >> "$GITHUB_ENV"

      - name: Check version not already on PyPI
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request, urllib.error
          pkg, ver = "chatgame", os.environ["PACKAGE_VERSION"]
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/{pkg}/{ver}/json")
              print(f"{pkg} {ver} already on PyPI — bump version before tagging")
              sys.exit(1)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f"{pkg} {ver} not yet on PyPI — proceeding")
              else:
                  raise
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
