name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve package version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import ast
          from pathlib import Path
          src = Path("src/chatgame/__init__.py").read_text(encoding="utf-8")
          version = None
          for node in ast.parse(src).body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          version = ast.literal_eval(node.value)
                          break
          if not version:
              raise SystemExit("Could not resolve chatgame __version__")
          print(f"package_version={version}")
          PY

      - name: Check tag matches package version
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Publish workflow must run from a tag ref, got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"
            exit 1
          fi
          expected="v${{ steps.version.outputs.package_version }}"
          if [ "${tag_name}" != "${expected}" ]; then
            echo "Tag ${tag_name} != expected ${expected}"
            exit 1
          fi

      - name: Check release commit is on default branch
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release commit ${GITHUB_SHA} is not contained in origin/main"
            exit 1
          fi

      - name: Check PyPI version
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          package = "chatgame"
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package}/{version}/json"
          try:
              urllib.request.urlopen(url, timeout=20)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{package} {version} not yet on PyPI — proceeding")
                  sys.exit(0)
              raise
          print(f"Fail when version is already on PyPI: {package} {version}")
          sys.exit(1)
          PY
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Verify wheel contains packaged web assets
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          assert wheels, "No wheel produced"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {
              "chatgame/web_static/index.html",
              "chatgame/web_static/favicon.svg",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Wheel missing packaged web assets: {missing}")
          print(f"Verified packaged web assets in {wheels[0].name}")
          PY

      - name: Check dist
        run: twine check dist/*

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
