name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Verify source CLI contract
        run: |
          chatgame --version
          chatgame --tree
          chatgame --tree-brief

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Run frontend tests
        working-directory: web
        run: npm run test

      - name: Build packaged static assets
        working-directory: web
        run: npm run build:static

      - name: Verify packaged static assets are committed
        run: |
          if ! git diff --quiet -- src/chatgame/web_static; then
            echo "src/chatgame/web_static is out of date. Run: cd web && npm run build:static"
            git diff -- src/chatgame/web_static
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/test-results
            web/playwright-report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build packaged static assets
        working-directory: web
        run: |
          npm ci
          npm run build:static

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify wheel contains packaged web assets
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          assert wheels, "No wheel produced"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {
              "chatgame/web_static/index.html",
              "chatgame/web_static/favicon.svg",
              "chatgame/web_static/examples/cow-puzzle-6.png",
              "chatgame/web_static/examples/cow-puzzle-8.png",
              "chatgame/web_static/examples/cow-puzzle-10.png",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Wheel missing packaged web assets: {missing}")
          has_js = any(name.startswith("chatgame/web_static/assets/") and name.endswith(".js") for name in names)
          has_css = any(name.startswith("chatgame/web_static/assets/") and name.endswith(".css") for name in names)
          if not has_js or not has_css:
              raise SystemExit("Wheel missing packaged JS/CSS assets")
          print(f"Verified packaged web assets in {wheels[0].name}")
          PY

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          cd web
          npm ci
          npm run build:static
          cd ..
          python -m build --wheel

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Verify installed CLI contract
        working-directory: ${{ runner.temp }}
        run: |
          chatgame --version
          chatgame --tree
          chatgame --tree-brief

      - name: Verify setup in installed environment
        working-directory: ${{ runner.temp }}
        run: chatgame web setup

      - name: Start installed web server
        working-directory: ${{ runner.temp }}
        run: |
          chatgame web serve --port 8123 > "$RUNNER_TEMP/chatgame-serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/chatgame-serve.pid"

      - name: Probe installed web server
        working-directory: ${{ runner.temp }}
        run: |
          urls=(
            "/"
            "/play"
            "/play/cow-puzzle?tab=start"
            "/solve"
            "/solve/cow-puzzle?tab=solver"
            "/contribute"
            "/api/games"
            "/api/games/cow-puzzle/docs"
            "/examples/cow-puzzle-10.png"
          )
          for i in $(seq 1 30); do
            ok=1
            for url in "${urls[@]}"; do
              if ! curl -fsS "http://127.0.0.1:8123${url}" >/dev/null; then
                ok=0
                break
              fi
            done
            if [ "$ok" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chatgame-serve.log"
          exit 1

      - name: Print installed web server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/chatgame-serve.log" || true

      - name: Stop installed web server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/chatgame-serve.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/chatgame-serve.pid")" || true
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs
        run: mkdocs build --strict
