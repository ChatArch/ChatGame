name: Preview Docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Deploy preview
        run: |
          git fetch origin
          mike deploy dev -p --allow-empty
          preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dev/"
          echo "Preview: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const url   = `https://${owner}.github.io/${repo}/dev/`;
            const body  = `📖 Docs preview: ${url}`;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: context.payload.number,
            });
            const exists = comments.data.find(c => c.body.includes(url));
            if (!exists) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.payload.number, body,
              });
            }
