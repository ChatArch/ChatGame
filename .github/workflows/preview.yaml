name: Preview Docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Deploy preview
        run: |
          git fetch origin
          mike deploy dev -p --allow-empty
          site_url=$(python - <<'PY'
          from pathlib import Path
          for line in Path("mkdocs.yml").read_text(encoding="utf-8").splitlines():
              if line.startswith("site_url:"):
                  print(line.split(":", 1)[1].strip().rstrip("/"))
                  break
          else:
              raise SystemExit("mkdocs.yml is missing site_url")
          PY
          )
          preview_url="${site_url}/dev/"
          echo "CHATARCH_PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "Preview: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const { payload, repo } = context;
            const previewLink = process.env.CHATARCH_PREVIEW_URL;
            const body = `📖 Docs preview: ${previewLink}`;
            const comments = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: payload.number,
            });
            const exists = comments.data.find(comment => comment.body.includes(previewLink));
            if (!exists) {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: payload.number,
                body,
              });
            }
