[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgame"
dynamic = ["version"]
description = "Game puzzle screenshot solver with CLI and Web UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "chatstyle>=0.1.0",
    "chatenv>=0.1.1",
    "pillow>=9.0",
    "scikit-learn>=1.0",
    "numpy>=1.23",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatgame", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatGame"
Repository = "https://github.com/ChatArch/ChatGame"
Documentation = "https://arch.gh.wzhecnu.cn/ChatGame/"

[project.scripts]
chatgame = "chatgame.cli:main"

[project.optional-dependencies]
dev = ["build", "httpx", "pytest", "pytest-mock", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatgame.__version__"}

[tool.setuptools.package-data]
chatgame = ["web_static/**/*", "web_static/**/.*", "docs/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
