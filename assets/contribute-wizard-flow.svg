<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">Contribute wizard flow</title>
  <desc id="desc">A safe workflow from upload to model analysis, user PRD review, and pending maintainer workflow.</desc>
  <rect width="980" height="280" rx="24" fill="#fbf7ed"/>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <g transform="translate(50 78)">
      <rect width="170" height="104" rx="18" fill="#ffffff" stroke="#d7c9aa"/>
      <text x="85" y="38" font-size="16" font-weight="700" fill="#2f2a22">1. 上传资料</text>
      <text x="85" y="68" font-size="12" fill="#6f6758">截图 + 规则</text>
    </g>
    <path d="M238 130h52" stroke="#b89a52" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(310 78)">
      <rect width="170" height="104" rx="18" fill="#ffffff" stroke="#d7c9aa"/>
      <text x="85" y="38" font-size="16" font-weight="700" fill="#2f2a22">2. 模型分析</text>
      <text x="85" y="66" font-size="12" fill="#6f6758">判断模糊点</text>
      <text x="85" y="84" font-size="12" fill="#6f6758">无模糊点则直达 PRD</text>
    </g>
    <path d="M498 130h52" stroke="#b89a52" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(570 78)">
      <rect width="170" height="104" rx="18" fill="#ffffff" stroke="#d7c9aa"/>
      <text x="85" y="38" font-size="16" font-weight="700" fill="#2f2a22">3. 用户 Review</text>
      <text x="85" y="66" font-size="12" fill="#6f6758">编辑 PRD</text>
      <text x="85" y="84" font-size="12" fill="#6f6758">可返回上一步</text>
    </g>
    <path d="M758 130h52" stroke="#b89a52" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(830 78)">
      <rect width="120" height="104" rx="18" fill="#edf7ef" stroke="#9ac4a7"/>
      <text x="60" y="38" font-size="16" font-weight="700" fill="#214d38">4. 工作流</text>
      <text x="60" y="66" font-size="12" fill="#4e6f5d">先 pending</text>
      <text x="60" y="84" font-size="12" fill="#4e6f5d">再维护者审</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b89a52" />
    </marker>
  </defs>
</svg>
